<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作問システム</title>
<link rel="stylesheet" href="/static/index.css?v=__V__">
</head>
<body>

<!-- 画面1: ログイン -->
<div id="screen-login" class="screen center-screen active">
  <div class="card">
    <div class="card-expression" id="login-expression">　</div>
    <div class="card-title">作問システム</div>
    <div class="card-label">出席番号を入力してね</div>
    <input class="input-id" id="input-id" type="text"
      maxlength="2" placeholder="00" autocomplete="off" spellcheck="false">
    <div class="input-hint">半角英数字2桁（例: 01 / ag）</div>
    <div class="error-msg" id="login-error"></div>
    <button class="btn btn-primary" id="btn-login">次へ</button>
  </div>
</div>

<!-- 画面2: 作問 -->
<div id="screen-game" class="screen">
  <div class="chat-panel">
    <div class="chat-header">
      <div class="expression" id="game-expression">　</div>
      <div class="subtitle">この 式に なる お話を 作ろう</div>
    </div>
    <div class="chat-log" id="chat-log"></div>
    <div class="chat-input-area">
      <textarea class="chat-input" id="chat-input"
        rows="2" placeholder="お話をここに書いてね…"></textarea>
      <button class="btn-send" id="btn-send">送る</button>
    </div>
  </div>

  <div class="meter-panel">
    <div class="panel-card">
      <div class="user-card">
        <div>
          <div class="user-card-name" id="game-user-name"></div>
          <div class="user-card-sub">出席番号</div>
        </div>
        <button class="btn-logout" id="btn-logout">ログアウト</button>
      </div>
    </div>

    <!-- 信号機：ラベルなしの3灯。未到達は空白のまま見せ、何が空いているかは明示しない。
         フェーズ2で水準3到達後に表示 -->
    <div class="panel-card" id="lights-card" hidden>
      <h3>聞けること</h3>
      <div class="lights">
        <div class="light" id="light-0">⭐</div>
        <div class="light" id="light-1">⭐</div>
        <div class="light" id="light-2">⭐</div>
      </div>
      <div class="lights-label" id="lights-label">あと 3 つ</div>
    </div>

    <!-- 作った問題：フェーズ2で水準1到達後に表示（水準1の産出一覧が初めての可視化） -->
    <div class="panel-card" id="problems-card" hidden>
      <h3>作った お話 <span id="count-number">0</span></h3>
      <ul class="problem-list" id="problem-list"></ul>
    </div>
  </div>
</div>

<!-- フェーズ切替の合図 -->
<div id="phase-banner" class="phase-banner" hidden>
  <div class="phase-banner-inner">
    <div class="phase-banner-title">ここまでで いったん おしまい</div>
    <div class="phase-banner-sub" id="phase-banner-sub"></div>
  </div>
</div>

<script src="/static/index.js?v=__V__"></script>
</body>
</html>
