<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作問システム</title>
<link rel="stylesheet" href="/static/index.css?v=__V__">
</head>
<body>

<!-- 画面1: ログイン -->
<div id="screen-login" class="screen center-screen active">
  <div class="card">
    <div class="card-expression" id="login-expression">　</div>
    <div class="card-title">作問システム</div>
    <div class="card-label">出席番号を入力してね</div>
    <input class="input-id" id="input-id" type="text"
      maxlength="2" placeholder="00" inputmode="numeric" autocomplete="off" spellcheck="false">
    <div class="input-hint">数字2桁（例: 01 / 23）</div>
    <div class="error-msg" id="login-error"></div>
    <button class="btn btn-primary" id="btn-login">次へ</button>
  </div>
</div>

<!-- 画面1b: 出席番号の確認（ID入力の直後に1回だけ） -->
<div id="screen-confirm" class="screen center-screen">
  <div class="card">
    <div class="card-title">作問システム</div>
    <div class="confirm-number" id="confirm-number">00</div>
    <div class="confirm-text"><span id="confirm-number-text">00</span>番 で 始めるよ。<br>これで いいかな？</div>
    <div class="confirm-actions">
      <button class="btn btn-primary" id="btn-confirm-yes">はい</button>
      <button class="btn btn-secondary" id="btn-confirm-no">ちがう</button>
    </div>
  </div>
</div>

<!-- 画面2: 作問 -->
<div id="screen-game" class="screen">
  <div class="chat-panel">
    <div class="chat-header">
      <div class="expression" id="game-expression">　</div>
      <div class="subtitle">この 式に なる 問題を 作ろう</div>
      <!-- 目標の固定表示（予告が確定している間だけ。ヘッダーに固定＝スクロールしても見える） -->
      <div class="target-bar" id="target-bar" hidden>
        いま めざして いるのは「<strong id="target-label"></strong>」を 求める 問題
      </div>
    </div>
    <div class="chat-log" id="chat-log"></div>
    <!-- 入力欄は1つ。弱の直後は同じ欄から予告を送る（そのときはプレースホルダを消す） -->
    <div class="chat-input-area" id="chat-input-area">
      <textarea class="chat-input" id="chat-input"
        rows="2" placeholder="問題をここに書いてね…"></textarea>
      <button class="btn-send" id="btn-send">送る</button>
    </div>
    <!-- フェーズ1・3だけ：作った お話を 見る（選択画面へ）。目立たせない。フェーズ2では出さない -->
    <div class="review-bar" id="review-bar" hidden>
      <button class="btn-review" id="btn-review">作った お話を 見る</button>
    </div>
  </div>

  <div class="meter-panel">
    <div class="panel-card">
      <div class="user-card">
        <div>
          <div class="user-card-name" id="game-user-name"></div>
          <div class="user-card-sub">出席番号</div>
        </div>
        <button class="btn-logout" id="btn-logout">ログアウト</button>
      </div>
    </div>

    <!-- 進捗（信号機）：到達構造の数だけを無地のマークで示す。どの構造かは示さない。フェーズ2の間は常時表示 -->
    <div class="panel-card" id="lights-card" hidden>
      <h3>つくった お話</h3>
      <div class="lights">
        <span class="light" id="light-0">○</span>
        <span class="light" id="light-1">○</span>
        <span class="light" id="light-2">○</span>
      </div>
    </div>

    <!-- つくった問題の一覧：フェーズ2のあいだ常に表示（強の「◯ばんの お話」はこの番号） -->
    <div class="panel-card" id="problems-card" hidden>
      <h3>つくった 問題 <span id="count-number">0</span></h3>
      <ul class="problem-list" id="problem-list"></ul>
    </div>
  </div>
</div>

<!-- 画面3: 作った お話を 見る（フェーズ1・3。ちがう 種類の お話を 3つ 選ぶ） -->
<div id="screen-select" class="screen center-screen">
  <div class="card select-card">
    <div class="select-title" id="select-title">作った お話の 中から、ちがう 種類の お話を 3つ 選びましょう。</div>
    <div class="select-empty" id="select-empty" hidden>お話が ないので、選ぶ ものは ありません。</div>
    <ul class="select-list" id="select-list"></ul>
    <div class="select-count" id="select-count"></div>
    <div class="error-msg" id="select-error"></div>
    <div class="confirm-actions">
      <button class="btn btn-primary" id="btn-select-submit">これで 決定</button>
      <button class="btn btn-secondary" id="btn-select-back">もどる</button>
    </div>
    <!-- 決定の前に1回だけ確認する -->
    <div class="select-confirm" id="select-confirm" hidden>
      <div class="confirm-text">この お話で 決定して いいかな？</div>
      <div class="confirm-actions">
        <button class="btn btn-primary" id="btn-select-yes">はい</button>
        <button class="btn btn-secondary" id="btn-select-no">まだ</button>
      </div>
    </div>
  </div>
</div>

<!-- フェーズ切替の合図 -->
<div id="phase-banner" class="phase-banner" hidden>
  <div class="phase-banner-inner">
    <div class="phase-banner-title">ここまでで いったん おしまい</div>
    <div class="phase-banner-sub" id="phase-banner-sub"></div>
  </div>
</div>

<script src="/static/index.js?v=__V__"></script>
</body>
</html>
